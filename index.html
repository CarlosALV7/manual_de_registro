<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Portal de Proveedores</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700;800&family=Nunito+Sans:wght@400;600;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: sticky top bar with country + language, route-style hero of the 3 stages, then a sticky section index beside one reading column; steps carry framed screenshots that open full size. */
:root {
  --bg: #F4F4F6;
  --surface: #FFFFFF;
  --ink: #111114;
  --muted: #5E5E68;
  --line: #E1E1E6;
  --accent: #A92789;
  --accent-soft: #F7E7F2;
  --signal: #A86A00;
  --signal-soft: #FFF3D9;
  --ok: #3E8E0F;
  --bad: #C0392B;
  --scrim: rgba(8, 8, 12, .84);
  --band: #010101;
  --band-ink: #FFFFFF;
  --on-accent: #FFFFFF;
  --px1: #A92789; --px2: #DDA0E9; --px3: #66AAEB; --px4: #A8C6EA; --px5: #C9ED83; --px6: #61BC17; --px7: #E2E2E2;
  --display: "Poppins", "Segoe UI", system-ui, sans-serif;
  --body: "Nunito Sans", "Segoe UI", system-ui, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0E0E11; --surface: #18181D; --ink: #EDEDF2; --muted: #A2A2AE; --line: #2C2C34;
    --accent: #E58AD0; --accent-soft: #3A1B33; --signal: #F2B84B; --signal-soft: #3A2E15;
    --ok: #8FD45A; --bad: #F08070; --scrim: rgba(0, 0, 0, .88); --band: #000000; --band-ink: #FFFFFF; --on-accent: #1A0714; --px7: #3A3A42; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0E0E11; --surface: #18181D; --ink: #EDEDF2; --muted: #A2A2AE; --line: #2C2C34;
    --accent: #E58AD0; --accent-soft: #3A1B33; --signal: #F2B84B; --signal-soft: #3A2E15;
    --ok: #8FD45A; --bad: #F08070; --scrim: rgba(0, 0, 0, .88); --band: #000000; --band-ink: #FFFFFF; --on-accent: #1A0714; --px7: #3A3A42; color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 17px; line-height: 1.6; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface); }
.wrap { max-width: 1120px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
h1, h2, h3 { font-family: var(--display); text-wrap: balance; line-height: 1.15; margin: 0; }
a { color: var(--accent); }
button, select, input, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* Top bar: white like the booking site, logo left, controls right */
.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: #FFFFFF; color: #111114; box-shadow: 0 1px 0 rgba(0,0,0,.06); }
.bar .wrap { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 20px; padding-block: 12px; }
.brand { display: flex; align-items: center; gap: 14px; margin-right: auto; min-width: 0; text-decoration: none; color: inherit; }
.brand img { height: 30px; width: auto; display: block; }
.brand b { font-family: var(--display); font-size: 1.2rem; font-weight: 700; letter-spacing: -.01em; }
.brand span { font-size: .8rem; color: #5E5E68; font-weight: 600; padding-left: 14px; border-left: 1px solid #E1E1E6; line-height: 1.2; }
.controls { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.controls label { font-size: .78rem; color: #5E5E68; font-weight: 700; display: flex; align-items: center; gap: 8px; }
.bar select { background: #F4F4F6; color: #111114; border: 1px solid #E1E1E6; border-radius: 999px; padding: 7px 14px; min-width: 0; max-width: 220px; font-weight: 600; }
select { background: var(--bg); border: 1px solid var(--line); border-radius: 999px; padding: 7px 14px; min-width: 0; max-width: 220px; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; overflow: hidden; flex-wrap: wrap; padding: 2px; gap: 2px; background: var(--bg); }
.seg button { background: transparent; border: 0; border-radius: 999px; padding: 6px 14px; cursor: pointer; font-weight: 700; font-size: .88rem; }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--on-accent); }
.bar .seg { background: #F4F4F6; border-color: #E1E1E6; }
.bar .seg button { color: #111114; }
.bar .seg button[aria-pressed="true"] { background: #A92789; color: #FFFFFF; }
.helpLink { font-weight: 700; font-size: .88rem; text-decoration: none; border: 1.5px solid #A92789; border-radius: 999px; padding: 6px 16px; background: none; color: #A92789; cursor: pointer; }
/* Brand pixel strip under the header, echoing the squares of the logo */
.pixels { display: grid; grid-template-columns: repeat(7, 1fr); height: 6px; }
.pixels i:nth-child(1) { background: var(--px1); } .pixels i:nth-child(2) { background: var(--px2); } .pixels i:nth-child(3) { background: var(--px3); }
.pixels i:nth-child(4) { background: var(--px4); } .pixels i:nth-child(5) { background: var(--px5); } .pixels i:nth-child(6) { background: var(--px6); } .pixels i:nth-child(7) { background: #111114; }

/* Hero band: black, like the booking hero, with a pixel mosaic on the right */
.heroBand { background: var(--band); color: var(--band-ink); position: relative; overflow: hidden; }
.heroBand::after { content: ""; position: absolute; right: 0; top: 0; width: min(36vw, 380px); height: 100%; opacity: .9;
  background:
    linear-gradient(var(--px1), var(--px1)) 100% 0 / 25% 25% no-repeat,
    linear-gradient(var(--px2), var(--px2)) 75% 0 / 25% 25% no-repeat,
    linear-gradient(var(--px3), var(--px3)) 50% 0 / 25% 25% no-repeat,
    linear-gradient(var(--px6), var(--px6)) 100% 33.3% / 25% 25% no-repeat,
    linear-gradient(var(--px5), var(--px5)) 75% 33.3% / 25% 25% no-repeat,
    linear-gradient(var(--px4), var(--px4)) 100% 66.6% / 25% 25% no-repeat; }
.hero { padding-block: 48px 104px; position: relative; z-index: 1; }
.eyebrow { font-family: var(--display); font-size: .8rem; font-weight: 600; color: var(--px2); letter-spacing: .04em; }
.hero h1 { font-size: clamp(1.9rem, 4.4vw, 3.1rem); font-weight: 800; letter-spacing: -.02em; margin-top: 10px; max-width: 20ch; }
.hero p.lead { color: rgba(255,255,255,.78); max-width: 60ch; margin: 14px 0 0; font-size: 1.06rem; }

/* Booking-style widget card that overlaps the hero */
.widget { position: relative; z-index: 2; margin-top: -72px; background: var(--surface); border-radius: 20px; box-shadow: 0 12px 40px rgba(0,0,0,.14); padding: 22px 24px 24px; }
.widget .tabs { display: flex; gap: 6px; border-bottom: 1px solid var(--line); margin: -4px 0 18px; }
.widget .tabs span { font-family: var(--display); font-weight: 600; font-size: .92rem; padding: 4px 4px 10px; margin-right: 14px; border-bottom: 3px solid var(--accent); color: var(--ink); }
.route { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); position: relative; gap: 10px; }
.stop { position: relative; min-width: 0; background: var(--bg); border-radius: 14px; padding: 12px 14px 12px 50px; }
.stop .dot { position: absolute; left: 14px; top: 14px; width: 26px; height: 26px; border-radius: 50%; background: var(--surface); border: 2px solid var(--accent); }
.stop:first-child .dot { background: var(--accent); }
.stop small { display: block; font-size: .72rem; color: var(--muted); font-weight: 700; letter-spacing: .04em; text-transform: uppercase; }
.stop strong { display: block; font-family: var(--display); font-size: .98rem; font-weight: 600; line-height: 1.3; }
.ask { margin-top: 14px; display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px; border: 1px solid var(--line); border-radius: 14px; padding: 12px 16px; }
.ask strong { font-family: var(--display); font-size: .96rem; font-weight: 600; }
.ask .seg button { padding: 7px 14px; }
.ask .opt { margin-left: auto; display: flex; align-items: center; gap: 8px; font-size: .92rem; color: var(--muted); }
.ask .opt input { width: 18px; height: 18px; accent-color: var(--accent); }
.actions { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 10px; margin-top: 16px; }
.btn { display: inline-flex; align-items: center; gap: 8px; border-radius: 999px; padding: 10px 20px; font-weight: 700; text-decoration: none; border: 1.5px solid var(--accent); cursor: pointer; background: transparent; color: var(--accent); }
.btn.primary { background: var(--accent); color: var(--on-accent); }
.widget .btn.primary { padding: 12px 34px; font-size: 1.02rem; }
.btn.primary:hover { filter: brightness(1.08); }

/* Body */
.layout { display: grid; grid-template-columns: 220px minmax(0, 1fr); gap: 40px; padding-block: 28px 64px; }
.toc { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 84px); align-self: start; display: flex; flex-direction: column; gap: 2px; border-left: 1px solid var(--line); }
.toc button { text-align: left; background: none; border: 0; border-left: 2px solid transparent; margin-left: -1px; padding: 6px 12px; cursor: pointer; color: var(--muted); font-size: .92rem; line-height: 1.35; }
.toc button.on { color: var(--accent); border-left-color: var(--accent); font-weight: 700; }
.toc .sep { font-size: .7rem; text-transform: uppercase; letter-spacing: .1em; color: var(--muted); padding: 14px 12px 4px; }
main { display: flex; flex-direction: column; gap: 22px; min-width: 0; }
.partTitle { font-family: var(--display); font-size: 1.1rem; font-weight: 700; color: var(--ink); margin-top: 18px; display: flex; align-items: center; gap: 10px; }
.partTitle::before { content: ""; width: 12px; height: 12px; background: var(--accent); box-shadow: 14px 0 0 var(--px2), 28px 0 0 var(--px6); margin-right: 30px; }
section.card { background: var(--surface); border: 0; box-shadow: 0 2px 10px rgba(0,0,0,.05); border-radius: 18px; padding: 26px 28px; scroll-margin-top: calc(env(safe-area-inset-top, 0px) + 84px); min-width: 0; }
section.card header { display: flex; align-items: center; gap: 14px; margin-bottom: 14px; }
section.card header .num { font-family: var(--display); font-size: .8rem; font-weight: 700; color: var(--on-accent); background: var(--accent); border-radius: 999px; padding: 2px 10px; flex: none; }
section.card h2 { font-size: 1.35rem; font-weight: 700; }
section.card p { margin: 0 0 12px; max-width: 68ch; }
ol.steps { margin: 0; padding: 0; list-style: none; counter-reset: s; display: flex; flex-direction: column; gap: 16px; }
ol.steps > li { counter-increment: s; display: grid; grid-template-columns: 30px minmax(0, 1fr); gap: 10px; }
ol.steps > li > div { max-width: 70ch; min-width: 0; }
ol.steps > li::before { content: counter(s); font-family: var(--display); font-size: .8rem; font-weight: 700; width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; background: var(--accent); color: #FFFFFF; margin-top: 1px; }
ul.plain { margin: 0; padding-left: 20px; max-width: 68ch; }
.ui { font-family: var(--mono); font-size: .84em; background: var(--bg); border: 1px solid var(--line); border-radius: 5px; padding: 1px 6px; overflow-wrap: anywhere; -webkit-box-decoration-break: clone; box-decoration-break: clone; }
.note { display: grid; grid-template-columns: 4px minmax(0, 1fr); gap: 14px; background: var(--signal-soft); border-radius: 8px; padding: 12px 16px 12px 0; margin-top: 14px; max-width: 70ch; }
.note::before { content: ""; background: var(--signal); border-radius: 0 3px 3px 0; }
.note b { color: var(--signal); }
.note.info { background: var(--accent-soft); }
.note.info::before { background: var(--accent); }
.note.info b { color: var(--accent); }

/* Screenshots */
.shot { margin: 10px 0 0; max-width: 560px; }
.shot button { display: block; width: 100%; padding: 0; border: 1px solid var(--line); border-radius: 14px; overflow: hidden; background: var(--bg); cursor: zoom-in; text-align: left; }
.shot .chrome { display: flex; gap: 5px; padding: 6px 8px; border-bottom: 1px solid var(--line); background: var(--surface); }
.shot .chrome i { width: 7px; height: 7px; border-radius: 50%; background: var(--line); }
.shot img { display: block; width: 100%; max-height: 300px; object-fit: cover; object-position: top left; }
.shot figcaption { font-size: .82rem; color: var(--muted); margin-top: 6px; }
.noShots .shot { display: none; }
.lightbox { position: fixed; inset: 0; z-index: 20; background: var(--scrim); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; padding: calc(env(safe-area-inset-top, 0px) + 16px) max(16px, env(safe-area-inset-right, 0px)) calc(env(safe-area-inset-bottom, 0px) + 16px) max(16px, env(safe-area-inset-left, 0px)); cursor: zoom-out; }
.lightbox img { max-width: 100%; max-height: calc(100% - 60px); border-radius: 6px; background: #fff; }
.lightbox p { color: #fff; margin: 0; font-size: .95rem; text-align: center; max-width: 70ch; }
.lightbox button { position: absolute; top: calc(env(safe-area-inset-top, 0px) + 12px); right: max(12px, env(safe-area-inset-right, 0px)); background: #fff; color: #15242A; border: 0; border-radius: 8px; padding: 6px 12px; font-weight: 600; cursor: pointer; }

/* Bank table */
.table { overflow-x: auto; margin-top: 4px; }
table { border-collapse: collapse; width: 100%; min-width: 460px; }
th, td { text-align: left; padding: 10px 12px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { font-size: .74rem; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 600; }
td:first-child { font-weight: 600; width: 40%; }
.blank { font-family: var(--mono); font-size: .78rem; color: var(--signal); border: 1px dashed var(--signal); border-radius: 5px; padding: 1px 6px; overflow-wrap: anywhere; -webkit-box-decoration-break: clone; box-decoration-break: clone; }

/* CLABE checker */
.tool { margin-top: 20px; border: 1px solid var(--line); border-radius: 10px; padding: 16px 18px; background: var(--bg); }
.tool h3 { font-size: 1rem; }
.tool p { font-size: .95rem; color: var(--muted); }
.tool input { width: 100%; max-width: 360px; font-family: var(--mono); font-size: 1.05rem; letter-spacing: .08em; padding: 9px 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); }
.clabe-parts { display: flex; flex-wrap: wrap; gap: 8px 18px; margin-top: 12px; font-family: var(--mono); font-size: .85rem; font-variant-numeric: tabular-nums; }
.clabe-parts span { color: var(--muted); }
.verdict { margin-top: 10px; font-weight: 600; font-size: .95rem; }
.verdict.ok { color: var(--ok); }
.verdict.bad { color: var(--bad); }

/* Checklist */
.progress { display: flex; align-items: center; gap: 14px; margin-bottom: 16px; font-variant-numeric: tabular-nums; flex-wrap: wrap; }
.meter { flex: 1 1 200px; height: 8px; background: var(--bg); border: 1px solid var(--line); border-radius: 99px; overflow: hidden; }
.meter i { display: block; height: 100%; width: 0; background: var(--accent); transition: width .25s; }
.progress span { font-size: .9rem; color: var(--muted); }
.checks { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
.checks li { border-top: 1px solid var(--line); }
.checks li:last-child { border-bottom: 1px solid var(--line); }
.checks label { display: grid; grid-template-columns: 22px minmax(0, 1fr); gap: 12px; padding: 12px 4px; cursor: pointer; }
.checks input { width: 18px; height: 18px; margin-top: 4px; accent-color: var(--accent); }
.checks .t { display: block; }
.checks .d { display: block; color: var(--muted); font-size: .92rem; }
.checks input:checked + span .t { text-decoration: line-through; text-decoration-color: var(--muted); color: var(--muted); }
.sub { margin-top: 8px; display: flex; flex-direction: column; gap: 6px; }
.sub div { font-size: .92rem; color: var(--muted); padding-left: 12px; border-left: 2px solid var(--line); }
.who { font-size: .85rem; color: var(--muted); margin-bottom: 10px; }

/* FAQ */
.faq details { border-top: 1px solid var(--line); }
.faq details:last-child { border-bottom: 1px solid var(--line); }
.faq summary { cursor: pointer; padding: 13px 4px; font-weight: 600; list-style: none; display: grid; grid-template-columns: minmax(0, 1fr) 20px; gap: 12px; }
.faq summary::-webkit-details-marker { display: none; }
.faq summary::after { content: "+"; font-family: var(--mono); color: var(--accent); text-align: center; }
.faq details[open] summary::after { content: "–"; }
.faq .a { padding: 0 4px 14px; color: var(--ink); max-width: 68ch; }
.faq .tag { font-family: var(--mono); font-size: .7rem; color: var(--muted); text-transform: uppercase; letter-spacing: .08em; margin-left: 8px; font-weight: 400; }

/* Help */
.helpGrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; margin-bottom: 20px; }
.channel { border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.channel h3 { font-size: 1rem; }
.channel p { font-size: .92rem; color: var(--muted); margin: 0; }
.channel .val { font-family: var(--mono); font-size: .88rem; overflow-wrap: anywhere; }
.channel .row { display: flex; flex-wrap: wrap; gap: 8px; margin-top: auto; padding-top: 6px; }
.small { padding: 5px 12px; font-size: .88rem; }

/* CLABE anatomy + bank list */
.anatomy { display: flex; flex-wrap: wrap; gap: 4px; margin: 14px 0 6px; font-family: var(--mono); font-variant-numeric: tabular-nums; }
.anatomy div { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.anatomy b { font-size: 1.15rem; letter-spacing: .12em; padding: 6px 10px; border-radius: 6px; background: var(--bg); border: 1px solid var(--line); font-weight: 600; }
.anatomy .key b { background: var(--accent); color: var(--surface); border-color: var(--accent); }
.anatomy span { font-family: var(--body); font-size: .78rem; color: var(--muted); }
.anatomy .key span { color: var(--accent); font-weight: 600; }
.banks { margin-top: 14px; max-height: 420px; overflow: auto; border: 1px solid var(--line); border-radius: 8px; }
.banks table { min-width: 420px; }
.banks thead th { position: sticky; top: 0; background: var(--surface); }
.banks td { padding: 7px 12px; font-size: .94rem; }
.banks td:first-child { width: 70px; font-family: var(--mono); font-weight: 600; color: var(--accent); }
.banks td:last-child { font-family: var(--mono); font-size: .85rem; width: 140px; }
.banks td.none { color: var(--muted); font-family: var(--body); }

/* Questionnaire guide */
.qgroup { margin-top: 18px; }
.qgroup h3 { font-size: 1.02rem; display: flex; align-items: baseline; gap: 10px; }
.qgroup h3 .ui { font-weight: 600; }
.qlist { list-style: none; margin: 10px 0 0; padding: 0; display: flex; flex-direction: column; }
.qlist li { display: grid; grid-template-columns: 56px minmax(0, 1fr); gap: 12px; padding: 10px 0; border-top: 1px solid var(--line); }
.qlist .qn { font-family: var(--mono); font-size: .82rem; font-weight: 600; color: var(--accent); padding-top: 2px; }
.qlist .qq { display: block; color: var(--muted); font-size: .92rem; }
.qlist .qa { display: block; font-weight: 600; }
.qlist .qt { display: block; font-size: .9rem; margin-top: 4px; color: var(--signal); }
.tips { margin: 6px 0 0; padding-left: 20px; max-width: 70ch; display: flex; flex-direction: column; gap: 6px; }

footer { background: var(--band); color: rgba(255,255,255,.72); padding-block: 28px 44px; font-size: .88rem; }
footer::before { content: ""; display: block; height: 6px; margin-top: -28px; margin-bottom: 22px; background: linear-gradient(90deg, var(--px1) 0 14.3%, var(--px2) 0 28.6%, var(--px3) 0 42.9%, var(--px4) 0 57.2%, var(--px5) 0 71.5%, var(--px6) 0 85.8%, #444 0); }

@media (max-width: 820px) {
  .heroBand::after { width: 120px; height: 90px; opacity: .55; }
  .hero { padding-block: 32px 96px; }
  .widget { padding: 18px 16px 20px; border-radius: 18px; }
  .brand span { display: none; }
  .brand img { height: 24px; }
  .bar .wrap { gap: 8px 10px; padding-block: 10px; }
  .controls { gap: 6px; }
  .controls label > span { display: none; }
  .bar select { max-width: 150px; padding: 6px 10px; }
  .seg button { padding: 5px 11px; }
  .helpLink { padding: 5px 12px; }
  .actions { justify-content: stretch; }
  .actions .btn { flex: 1 1 auto; justify-content: center; }
  .layout { grid-template-columns: minmax(0, 1fr); }
  .toc { display: none; }
  section.card { padding: 20px 18px; }
  .route { grid-template-columns: minmax(0, 1fr); gap: 8px; }
  .ask .opt { margin-left: 0; }
  .table table, .banks table { min-width: 0; }
  .anatomy b { font-size: 1rem; padding: 5px 7px; }
}
@media (prefers-reduced-motion: reduce) { .meter i { transition: none; } }
</style>

</head>
<body>
<div class="bar">
  <div class="wrap">
    <div class="brand"><img id="brandLogo" alt="" hidden><b id="brandName"></b><span id="brandSub"></span></div>
    <div class="controls">
      <label for="country"><span id="lblCountry"></span>
        <select id="country"></select>

function bankBody(L, r) {
  const T = L === "es";
  const rows = BANK[r].map(([f, v]) => `<tr><td>${f[L]}</td><td>${v === "BLANK" ? blank(L) : (v[L] || "—")}</td></tr>`).join("");
  const head = T ? "<th>Campo en Ariba</th><th>Qué capturar</th>" : "<th>Ariba field</th><th>What to enter</th>";
  const intro = T ? `<p>En la sección <b>11</b> haga clic en ${ui("Agregar información bancaria")} y llene así:</p>` : `<p>In section <b>11</b> click ${ui("Add Bank Information")} and fill it in like this:</p>`;
  let extra = "";
  if (r === "mx") {
    const list = BANKS_MX.map(([k, n, sw]) => `<tr><td>${k}</td><td>${esc(n)}</td><td${sw ? "" : ' class="none"'}>${sw ? esc(sw) : "—"}</td></tr>`).join("");
    extra = `
      <div class="tool">
        <h3>${T ? "¿Cuál es mi clave bancaria?" : "What is my bank key?"}</h3>
        <p>${T ? "Son los 3 primeros dígitos de su CLABE interbancaria. Por ejemplo, si su CLABE empieza con <b>012</b>, en Clave bancaria escriba <b>012</b>." : "It's the first 3 digits of your CLABE. For example, if your CLABE starts with <b>012</b>, enter <b>012</b> as the bank key."}</p>
        <div class="anatomy" aria-label="CLABE">
          <div class="key"><b>012</b><span>${T ? "Clave bancaria" : "Bank key"}</span></div>
          <div><b>180</b><span>${T ? "Plaza" : "City"}</span></div>
          <div><b>01234567890</b><span>${T ? "Cuenta" : "Account"}</span></div>
          <div><b>1</b><span>${T ? "Verificador" : "Check digit"}</span></div>
        </div>
        <p>${T ? "En Número de cuenta van los 18 dígitos completos. Ejemplo ilustrativo, no es una cuenta real." : "The account number field takes all 18 digits. Illustrative example, not a real account."}</p>
        <div class="banks"><table>
          <thead><tr><th>${T ? "Clave" : "Key"}</th><th>${T ? "Banco" : "Bank"}</th><th>SWIFT</th></tr></thead>
          <tbody>${list}</tbody>
        </table></div>
      </div>`;

  return `${intro}<div class="table"><table><thead><tr>${head}</tr></thead><tbody>${rows}</tbody></table></div>${extra}${save}`;
}

function questionBody(L, r) {
  const T = L === "es";
  const flow = FLOW_OF[r];
  const groups = QGUIDE[flow](r).map(g => {
    const fig = `<figure class="shot"><button type="button" data-zoom="${CONFIG.imgBase}${g.img}.jpg" data-cap="${esc(g.h[L])}" aria-label="${esc(g.h[L])}: ${UI[L].zoom}"><span class="chrome"><i></i><i></i><i></i></span><img src="${CONFIG.imgBase}${g.img}.jpg" alt="${esc(g.h[L])}" loading="lazy"></button><figcaption>${g.h[L]} · ${UI[L].zoom}</figcaption></figure>`;
    const items = g.items.map(q => `<li><span class="qn">${q.n}</span><div><span class="qq">${q.q[L]}</span><span class="qa">${q.a[L]}</span>${q.t ? `<span class="qt">${q.t[L]}</span>` : ""}</div></li>`).join("");
    return `<div class="qgroup"><h3>${g.h[L]}</h3><ul class="qlist">${items}</ul>${fig}</div>`;
  }).join("");
  const tips = T ? [
    "Tiene <b>72 horas (3 días)</b> para completar y enviar el cuestionario. Arriba a la derecha verá el <b>Tiempo restante</b>; si no termina de una vez, use Guardar borrador.",
    "Toda la información y los documentos son confidenciales y se usan solo para su registro y validación interna.",
    "Los campos con asterisco rojo (*) son obligatorios.",
    "Para subir un archivo: Adjuntar un archivo → Seleccionar archivo → Aceptar.",
    "Si el navegador le sugiere tarjetas o datos guardados, ignórelos. Escriba solo los datos de su empresa."
  ] : [
    "You have <b>72 hours (3 days)</b> to complete and submit the questionnaire. The <b>Time remaining</b> counter is at the top right; if you can't finish in one go, use Save Draft.",
    "All information and documents are confidential and used only for your registration and internal validation.",
    "Fields with a red asterisk (*) are required.",
    "To upload a file: Attach a file → Choose File → Accept.",
    "If your browser suggests saved cards or personal details, ignore them. Enter only your company's data."
  ];
  return `<p>${T ? "Así se contesta cada pregunta del <b>Supplier Registration Questionnaire</b>, en el orden en que aparece." : "Here's how to answer each question of the <b>Supplier Registration Questionnaire</b>, in order."}</p>
    ${note(`<b>${T ? "Antes de empezar" : "Before you start"}</b><ul class="tips">${tips.map(t => `<li>${t}</li>`).join("")}</ul>`, true)}
    ${groups}`;
}

    { es: ["Número de identificación fiscal (Tax ID)", ""], en: ["Tax ID number", ""] },
    { es: ["Formulario W-9 o W-8BEN", "Según aplique."], en: ["Form W-9 or Form W-8BEN", "As applicable."] },
    { es: ["Identificación del representante legal", "Pasaporte, documento nacional de identidad o documento de ciudadanía."], en: ["Legal representative identification", "Passport, national identity document or citizenship document."] },
    { es: ["Documento que acredite los poderes del representante legal", "Certificate of Incumbency o documento equivalente."], en: ["Document certifying the powers of the legal representative", "Certificate of Incumbency or equivalent document."] },
    { es: ["Estado de cuenta bancario", "Si no tiene, entregue una carta en papel membretado del banco con sello y firma del ejecutivo de cuenta."], en: ["Bank account statement", "If not available, provide a letter on official bank letterhead with the account executive's stamp and signature."] }
  ]
};

function store(k, v) {
  try {
    if (v === undefined) return JSON.parse(localStorage.getItem(k) || "null");
    localStorage.setItem(k, JSON.stringify(v));
  } catch (e) { return null; }
}

function docsBody(L, r, country) {
  const done = store("portal-docs-" + country) || [];
  const cname = COUNTRIES.find(c => c.id === country)[L];
  const who = L === "es" ? `Lista para <b>${cname}</b>. Formato PDF o imagen legible.` : `List for <b>${cname}</b>. PDF or clearly legible image.`;
  const items = DOCS[r].map((doc, i) => {
    const [t, d] = doc[L];
    const sub = doc.sub ? `<div class="sub">${doc.sub[L].map(s => `<div>${s}</div>`).join("")}</div>` : "";
    return `<li><label><input type="checkbox" id="doc-${country}-${i}" data-i="${i}" ${done.includes(i) ? "checked" : ""}><span><span class="t">${t}</span>${d ? `<span class="d">${d}</span>` : ""}${sub}</span></label></li>`;
  }).join("");
  const tip = L === "es" ? "Marque cada documento cuando lo tenga listo. Su avance se guarda solo en este navegador." : "Tick each document once you have it ready. Your progress is saved in this browser only.";
  return `<div class="who">${who}</div>
    <div class="progress"><div class="meter"><i id="meter"></i></div><span id="progressTxt"></span></div>
    <ul class="checks" id="checks">${items}</ul>
    ${note(`<b>Tip:</b> ${tip}`, true)}`;
}

/* ---------- FAQ ---------- */

  { q: { es: "Ya tengo cuenta de Ariba con otro cliente. ¿Debo crear otra?", en: "I already have an Ariba account with another customer. Do I need a new one?" },

  { q: { es: "¿Dónde encuentro mi CLABE interbancaria?", en: "Where do I find my CLABE?" }, only: ["mx"],

    a: { es: `Sí. La información y los documentos se usan solo para su registro y validación interna en ${C}, y no se comparten con terceros.`, en: `Yes. Information and documents are used only for your registration and internal validation at ${C}, and are not shared externally.` } },

function faqBody(L, r) {
  const items = FAQ.filter(f => !f.only || f.only.includes(r)).map(f =>
    `<details data-text="${esc((f.q[L] + " " + f.a[L].replace(/<[^>]+>/g, "")).toLowerCase())}"><summary>${f.q[L]}</summary><div class="a">${f.a[L]}</div></details>`).join("");
  return `<div class="faq" id="faqList">${items}</div>`;
}

/* ---------- Help center (contact channels only: the portal never asks for data) ---------- */
function helpBody(L, r) {
  const T = L === "es";
  const tz = (() => { try { return Intl.DateTimeFormat().resolvedOptions().timeZone; } catch (e) { return ""; } })();
  const channels = [];
  if (CONFIG.supportEmail) channels.push(`<div class="channel"><h3>${T ? "Correo" : "Email"}</h3><p>${T ? "Escríbanos con el nombre de su empresa y el paso donde se quedó." : "Write to us with your company name and the step where you got stuck."}</p><div class="val">${esc(CONFIG.supportEmail)}</div><div class="row"><button type="button" class="btn small" data-copy="${esc(CONFIG.supportEmail)}">${UI[L].copy}</button></div></div>`);
  if (CONFIG.supportPhone) channels.push(`<div class="channel"><h3>${T ? "Teléfono" : "Phone"}</h3><p>${CONFIG.supportHours[L]}</p><div class="val">${esc(CONFIG.supportPhone)}</div><div class="row"><button type="button" class="btn small" data-copy="${esc(CONFIG.supportPhone)}">${UI[L].copy}</button></div></div>`);
  // Direct calls with the team are offered to national (Mexico) suppliers only
  if (r === "mx") channels.push(`<div class="channel"><h3>${T ? "Llamada directa con nuestro equipo" : "Direct call with our team"}</h3><p>${T ? "Exclusivo para proveedores nacionales. Le acompañamos en una llamada para completar el registro juntos." : "For national (Mexico) suppliers only. We walk you through the registration on a call."}</p>${CONFIG.bookingUrl
    ? `<div class="row"><a class="btn primary small" href="${esc(CONFIG.bookingUrl)}" target="_blank" rel="noopener">${T ? "Agendar llamada" : "Book a call"}</a></div>`
    : (CONFIG.supportEmail ? `<p>${T ? "Pídala por correo indicando dos horarios que le acomoden." : "Request it by email with two times that work for you."}</p>` : "")}</div>`);
  if (CONFIG.supportHours && !CONFIG.supportPhone) channels.push(`<div class="channel"><h3>${T ? "Horario de atención" : "Support hours"}</h3><p>${CONFIG.supportHours[L]}</p>${tz ? `<p>${T ? "Su zona horaria" : "Your time zone"}: <b>${esc(tz)}</b></p>` : ""}</div>`);
  return `<div class="helpGrid">${channels.join("")}</div>`;
}

/* ---------- State + render ---------- */
const state = { country: "mx", lang: "es", has: store("portal-has") || "all", shots: store("portal-shots") !== false };

function readInitial() {
  let lang = null, country = null;
  try {
    const q = new URLSearchParams(location.search);
    country = (q.get("pais") || q.get("country") || "").toLowerCase() || null;
    lang = (q.get("lang") || q.get("idioma") || "").toLowerCase() || null;
  } catch (e) {}
  const h = (location.hash || "").replace("#", "").toLowerCase();
  const m = h.match(/^([a-z]{2})(?:-(es|en))?$/);
  if (m) { country = m[1]; lang = m[2] || lang; }
  if (country && COUNTRIES.some(c => c.id === country)) state.country = country;
  const def = COUNTRIES.find(c => c.id === state.country).lang;
  state.lang = (lang === "es" || lang === "en") ? lang : def;
  if (h === "ayuda" || h === "help") state.jump = "contacto";
  if (h === "preguntas" || h === "faq") state.jump = "preguntas";
}

function syncHash() {
  try { history.replaceState(null, "", "#" + state.country + "-" + state.lang); } catch (e) {}
}

function sectionHtml(s, i, L, c, flow) {
  const body = s.body ? s.body(L, c.region, c.id) : (INTROS[s.id] ? INTROS[s.id][L] : "") + stepsHtml(flow, s.id, L) + (NOTES[s.id] ? NOTES[s.id][L] : "");
  return `<section class="card" id="sec-${s.id}">
      <header><span class="num">${i}</span><h2>${s.title[L]}</h2></header>
      ${body}
    </section>`;
}

function render() {
  const L = state.lang, T = UI[L];
  const c = COUNTRIES.find(x => x.id === state.country);
  const flow = FLOW_OF[c.region];
  document.documentElement.lang = L;
  document.title = L === "es" ? "Portal de Proveedores" : "Supplier Portal";
  document.body.classList.toggle("noShots", !state.shots);

  const logo = document.getElementById("brandLogo");
  if (CONFIG.logo) { logo.src = CONFIG.logo; logo.alt = C; logo.hidden = false; }
  document.getElementById("brandName").textContent = CONFIG.logo ? "" : C;
  document.getElementById("widgetTab").textContent = L === "es" ? "Registro de proveedores" : "Supplier registration";
  document.getElementById("brandSub").textContent = T.sub;
  document.getElementById("lblCountry").textContent = T.country;
  document.getElementById("helpTop").textContent = T.help;
  const sel = document.getElementById("country");
  sel.innerHTML = COUNTRIES.map(x => `<option value="${x.id}" ${x.id === c.id ? "selected" : ""}>${x[L]}</option>`).join("");
  ["es", "en"].forEach(l => document.getElementById("lang-" + l).setAttribute("aria-pressed", String(l === L)));

  document.getElementById("eyebrow").textContent = `${T.eyebrow} · ${c[L]}`;
  document.getElementById("title").textContent = T.title;
  document.getElementById("lead").textContent = T.lead;
  document.getElementById("route").innerHTML = T.stages.map((s, i) => `<div class="stop"><div class="dot"></div><small>${T.stage} ${i + 1}</small><strong>${s}</strong></div>`).join("");
  document.getElementById("ask").innerHTML = `<strong>${T.askQ}</strong>
    <div class="seg" role="group" aria-label="${esc(T.askQ)}">
      <button type="button" data-has="no" aria-pressed="${state.has === "no"}">${T.askNo}</button>
      <button type="button" data-has="yes" aria-pressed="${state.has === "yes"}">${T.askYes}</button>
      <button type="button" data-has="all" aria-pressed="${state.has === "all"}">${T.askAll}</button>
    </div>
    <label class="opt" for="shotsToggle"><input type="checkbox" id="shotsToggle" ${state.shots ? "checked" : ""}>${T.shots}</label>`;

  const pdfRegion = CONFIG.pdfs[c.region] || CONFIG.pdfs[c.id];
  const pdf = pdfRegion && (pdfRegion[L] || pdfRegion.es || pdfRegion.en);
  document.getElementById("actions").innerHTML =
    `<button class="btn primary" type="button" id="startBtn">${T.start}</button>` +
    (pdf ? `<a class="btn" href="${encodeURI(pdf)}" target="_blank" rel="noopener">${T.pdf}</a>` : "");

  const visible = SECTIONS.filter(s => !s.only || state.has === "all" || state.has === s.only);
  document.getElementById("toc").innerHTML =
    visible.map(s => `<button type="button" data-go="${s.id}" id="toc-${s.id}">${s.title[L]}</button>`).join("") +
    `<div class="sep">${T.helpPart}</div>` +
    HELP_SECTIONS.map(s => `<button type="button" data-go="${s.id}" id="toc-${s.id}">${s.title[L]}</button>`).join("");
  document.getElementById("content").innerHTML =
    `<div class="partTitle">${T.guide}</div>` +
    visible.map((s, i) => sectionHtml(s, String(i + 1).padStart(2, "0"), L, c, flow)).join("") +
    `<div class="partTitle">${T.helpPart}</div>` +
    HELP_SECTIONS.map(s => sectionHtml(s, s.tag, L, c, flow)).join("");

  document.getElementById("foot").textContent = T.foot(c[L]);

  bindDynamic();
  updateProgress();
  syncHash();
}

function updateProgress() {
  const box = document.getElementById("checks");
  if (!box) return;
  const all = box.querySelectorAll("input[type=checkbox]");
  const n = [...all].filter(x => x.checked).length;
  document.getElementById("meter").style.width = (all.length ? (n / all.length) * 100 : 0) + "%";
  document.getElementById("progressTxt").textContent = UI[state.lang].progress(n, all.length);
}

function bindDynamic() {
  const checks = document.getElementById("checks");
  if (checks) checks.addEventListener("change", () => {
    store("portal-docs-" + state.country, [...checks.querySelectorAll("input:checked")].map(x => Number(x.dataset.i)));
    updateProgress();
  });
  document.getElementById("shotsToggle").addEventListener("change", (e) => {
    state.shots = e.target.checked; store("portal-shots", state.shots);
    document.body.classList.toggle("noShots", !state.shots);
  });
  observeSections();
}

function go(id) {
  const el = document.getElementById("sec-" + id);
  if (el) el.scrollIntoView({ behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth", block: "start" });
}

function openZoom(src, cap) {
  const lb = document.getElementById("lightbox");
  lb.innerHTML = `<button type="button" id="lbClose">${UI[state.lang].close}</button><img src="${src}" alt="${esc(cap)}"><p>${esc(cap)}</p>`;
  lb.hidden = false;
  document.getElementById("lbClose").focus();
}
function closeZoom() { const lb = document.getElementById("lightbox"); lb.hidden = true; lb.innerHTML = ""; }

let observer;
function observeSections() {
  if (observer) observer.disconnect();
  if (!("IntersectionObserver" in window)) return;
  observer = new IntersectionObserver((entries) => {
    entries.forEach(e => {
      if (e.isIntersecting) {
        const id = e.target.id.replace("sec-", "");
        document.querySelectorAll(".toc button").forEach(b => b.classList.toggle("on", b.dataset.go === id));
      }
    });
  }, { rootMargin: "-30% 0px -60% 0px" });
  document.querySelectorAll("section.card").forEach(s => observer.observe(s));
}

// One delegated click handler for everything rendered dynamically
document.addEventListener("click", (e) => {
  const t = e.target;
  const goBtn = t.closest("[data-go]");
  if (goBtn) return go(goBtn.dataset.go);
  if (t.closest("#startBtn")) return go("invitacion");
  if (t.closest("#helpTop")) return go("contacto");
  const has = t.closest("[data-has]");
  if (has) { state.has = has.dataset.has; store("portal-has", state.has); render(); return go(state.has === "yes" ? "cuenta-existente" : state.has === "no" ? "cuenta-nueva" : "invitacion"); }
  const zoom = t.closest("[data-zoom]");
  if (zoom) return openZoom(zoom.dataset.zoom, zoom.dataset.cap);
  if (t.closest("#lightbox")) return closeZoom();
  const copy = t.closest("[data-copy]");
  if (copy) {
    const label = copy.textContent;
    const done = () => { copy.textContent = UI[state.lang].copied; setTimeout(() => { copy.textContent = label; }, 1600); };
    try {
      navigator.clipboard.writeText(copy.dataset.copy).then(done).catch(() => {
        const target = copy.closest(".channel").querySelector(".val");
        if (target) { const r = document.createRange(); r.selectNodeContents(target); const s = getSelection(); s.removeAllRanges(); s.addRange(r); }
      });
    } catch (err) {}
  }
});
document.addEventListener("keydown", (e) => { if (e.key === "Escape") closeZoom(); });
document.getElementById("country").addEventListener("change", (e) => { state.country = e.target.value; render(); });
document.querySelectorAll("[data-lang]").forEach(b => b.addEventListener("click", () => { state.lang = b.dataset.lang; render(); }));

readInitial();
render();
if (state.jump) setTimeout(() => go(state.jump), 50);
</script>

</body>
</html>
